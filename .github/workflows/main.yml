name: Build BFGMiner Windows

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          base-devel
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-libusb
          git
          autoconf
          automake
          libtool
          pkg-config
          curl

    - name: Install uthash (all required headers)
      shell: msys2 {0}
      run: |
        mkdir -p /mingw64/include
        curl -L https://raw.githubusercontent.com/troydhanson/uthash/master/src/uthash.h -o /mingw64/include/uthash.h
        curl -L https://raw.githubusercontent.com/troydhanson/uthash/master/src/utlist.h -o /mingw64/include/utlist.h
        curl -L https://raw.githubusercontent.com/troydhanson/uthash/master/src/utarray.h -o /mingw64/include/utarray.h
        curl -L https://raw.githubusercontent.com/troydhanson/uthash/master/src/utstring.h -o /mingw64/include/utstring.h

    - name: Build BFGMiner
      shell: msys2 {0}
      run: |
        ./autogen.sh || autoreconf -fi
        ./configure --with-libusb
        make -j4

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: bfgminer-windows
        path: bfgminer.exe
